name: Frames DICOM core
on:
  pull_request:
    branches: [frames/core-0.9.1]
  push:
    branches: [frames/core-0.9.1]
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.72.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: cargo +${{ matrix.rust }} test --locked -p dicom-core -p dicom-encoding -p dicom-parser -p dicom-object
